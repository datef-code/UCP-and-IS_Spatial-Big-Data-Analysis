# config/mapping.yaml —— ⑤ 映射方案（纯业务意图，全人写）
version: 1

ops:
  - op: geocode
    from: [SIMS_LATITUDE, SIMS_LONGITUDE]
    to: h3_cell
    engine: h3
    params: {res: 8}
    reason: R8 平均边长 ≈ 0.46 km，匹配 0–1 km 细环

  - op: derive
    to: event_type
    expr: "closed_ma if SIMS_ACQUIRED_DATE notnull else (attrition if last_year < 2025 else alive)"
    reason: 区分并购关闭 / 仍存活 / 数据缺失（attrition）

  - op: derive
    to: dep_sum_chg
    expr: "DEPSUMBR - DEPSUMBR.shift(1) over (UNINUMBR order by YEAR)"
    reason: 存款年度变动额（结果变量）

  - op: derive
    to: dep_sum_growth
    expr: "dep_sum_chg / DEPSUMBR.shift(1)"
    reason: 存款年度变动率

  - op: aggregate
    to: closure_exposure
    by: closure_event
    params:
      rings_km: [[0, 1], [1, 3], [3, 5], [5, 10]]        # 标准环
      rings_km_sensitivity: [[0, 2], [2, 5], [5, 10]]    # 坐标精度敏感性合并环
      strength: 同 BKCLASS 网点数
      control: 同 MSABR 存活网点
    reason: 构造 exposure 结构（处理组强度 + 对照）

  - op: drop
    fields: [BRNUM]
    reason: 跨年不稳定，弃用

outputs:
  - branch_year_panel.parquet    # 网点-年长表
  - branch_dim.csv               # 网点维度表
  - closure_exposure.csv         # 关闭事件 × 距离环 exposure 表
