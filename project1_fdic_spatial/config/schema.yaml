# config/schema.yaml —— 字段规格（role + level + 业务规则）
# role : key | event | time_varying | spatial | categorical | numeric | target | ignore
# level: required | important | optional | ignore
version: 1
dataset: fdic_sod
group_pattern: 'fdic_sod_#'

fields:
  - name: UNINUMBR
    role: key
    level: required
    dtype: string
    description: 跨年唯一网点号；本项目唯一追踪主键
    rules:
      - kind: not_null
      - kind: unique
        fields: [UNINUMBR, YEAR]
        message: UNINUMBR × YEAR 必须唯一
    note: >-
      判为 key+required：① 唯一性——非空后 UNINUMBR 唯一值 = 网点数（152,538）；
      ② 稳定性——跨年不重分配；③ 业务标识——对应真实网点实体。
      对照：BRNUM 观测≥2 年网点中 52.19% 首末年变化，唯一≠稳定，故弃用。
      缺它则记录无法定位、无法跨年 join → required，缺失即 drop_na。

  - name: CERT
    role: key
    level: required
    dtype: string
    description: 银行（机构）编号，用于银行层聚合
    rules:
      - kind: not_null
    note: >-
      判为 key+required：与 UNINUMBR 同属「记录定位」层，银行层聚合（脆弱性、关闭率）的
      唯一分组键。注意 CERT 会随并购改挂（52.17% 的网点首末年 CERT 变化），
      只作分组键、不作跨年追踪键。

  - name: YEAR
    role: key
    level: required
    dtype: integer
    description: 数据年份
    rules:
      - kind: range
        min: 1994
        max: 2025
    note: >-
      判为 key+required：面板的时间维，与 UNINUMBR 组成复合主键（唯一性断言即
      UNINUMBR × YEAR）。缺它无法定位事件时间与构造 event-time。

  - name: SIMS_ESTABLISHED_DATE
    role: event
    level: important
    dtype: datetime
    description: 网点设立（出生）日期
    rules:
      - kind: no_future_date
    note: >-
      判为 event+important：出生时间是「网点年龄」协变量与左截断判定的来源，
      影响结论但不决定记录能否定位，故 important 而非 required；缺失按左截断处理，不填充。

  - name: SIMS_ACQUIRED_DATE
    role: event
    level: important
    dtype: datetime
    description: 网点被并购 / 关闭（死亡）日期
    missing_semantics: 缺失 = 右删失（仍存活），是有意义信息，禁止填充
    rules:
      - kind: no_future_date
    note: >-
      判为 event+important：本课题「处理」的来源——有值才构成一起关闭事件。
      缺失率全期 66.36%，但缺失本身 = 右删失（仍存活），是有意义信息，
      因此 level 只到 important 且**明令禁止 fill**（填充会摧毁事件信息）。

  - name: DEPSUMBR
    role: time_varying
    level: required
    dtype: numeric
    description: 网点存款余额（美元）；结果变量来源
    rules:
      - kind: non_negative
        message: 存款不能为负
    note: >-
      判为 time_varying+required：本课题的结果变量 Y（存款增速）唯一来源。
      缺它结论完全不可得 → required；实测无负值、无缺失（负值规则作护栏）。

  - name: SIMS_LATITUDE
    role: spatial
    level: important
    dtype: numeric
    description: 网点纬度
    rules:
      - kind: geo_lat          # 内置 [-90, 90]
    note: >-
      判为 spatial+important：承担空间结构（H3 网格化、距离环、KNN 权重）。
      缺它则该观测失去空间位置 → 坐标列**明令禁止 fill**（填充会伪造位置），
      越界值置空（to_null）而非截断。实测缺失 8.04%，早年更严重。

  - name: SIMS_LONGITUDE
    role: spatial
    level: important
    dtype: numeric
    description: 网点经度
    rules:
      - kind: geo_lon          # 内置 [-180, 180]
    note: 同 SIMS_LATITUDE：承担空间结构，禁止填充，越界置空。另需注意 (0,0) 空岛（全期 572 条）不被范围断言捕获。

  - name: BKCLASS
    role: categorical
    level: important
    dtype: string
    description: 银行类别；用于「同业」判定（处理组强度按同 BKCLASS 计数）
    note: >-
      判为 categorical+important：本课题「同业」的定义本身由它决定（同 BKCLASS 才计入
      各环 exposure 强度），直接决定 exposure 口径 → important。无缺失、7 个取值。

  - name: MSABR
    role: categorical
    level: optional
    dtype: string
    description: 都会统计区（MSA）编号；与 METROBR 共同构成同城 / 同都会区对照口径
    note: 实测 1994–2025 全部 32 个年度文件（81 列）均不含 CBSA_METRO，故这是 SOD 全期唯一可用口径，非权宜替代

  - name: METROBR
    role: categorical
    level: optional
    dtype: string
    description: 都会区标识，与 MSABR 共同构成对照口径
    note: >-
      判为 optional：只用于辅助同城对照分组（主口径是 MSABR），缺失约 3.25%
      不影响主结论，故不升到 important。

  - name: SIMS_PROJECTION
    role: categorical
    level: optional
    dtype: string
    description: 地理编码方式；取值词表在 1994–2025 间换过两轮，不可跨年代直接比较
    note: >-
      精度口径（本地全量实测）：1994–2022 用 US_Rooftop / US_Streets / US_Zipcode / 0 / 100，
      屋顶级仅 16.37%；2023–2025 改用 EXACT / StreetAddress / PointAddress / Postal，
      EXACT 占 85.98%。早年多为插值坐标 → < 1 km 距离环有系统性失真，须做环宽敏感性。
      旧口径「EXACT 占 45.45%」已作废：它把编码体系切换与样本退出时间混为一谈。

  - name: BRNUM
    role: ignore
    level: ignore
    dtype: string
    description: 银行内网点序号
    note: 跨年不稳定（观测≥2 年网点中 52.19% 首末年变化），已弃用为追踪主键
