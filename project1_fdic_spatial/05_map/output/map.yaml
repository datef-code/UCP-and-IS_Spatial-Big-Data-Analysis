stage: 05_map
mapped_at: '2026-09-06T19:21:10'
scheme:
  source: config/mapping.yaml
  ops:
  - op: geocode
    from:
    - SIMS_LATITUDE
    - SIMS_LONGITUDE
    to: h3_cell
    engine: h3
    params:
      res: 8
    reason: R8 平均边长 ≈ 0.46 km，匹配 0–1 km 细环
  - op: derive
    to: event_type
    expr: closed_ma if SIMS_ACQUIRED_DATE notnull else (attrition if last_year < 2025
      else alive)
    reason: 区分并购关闭 / 仍存活 / 数据缺失（attrition）
  - op: derive
    to: dep_sum_chg
    expr: DEPSUMBR - DEPSUMBR.shift(1) over (UNINUMBR order by YEAR)
    reason: 存款年度变动额（结果变量）
  - op: derive
    to: dep_sum_growth
    expr: dep_sum_chg / DEPSUMBR.shift(1)
    reason: 存款年度变动率
  - op: aggregate
    to: closure_exposure
    by: closure_event
    params:
      rings_km:
      - - 0
        - 1
      - - 1
        - 3
      - - 3
        - 5
      - - 5
        - 10
      rings_km_sensitivity:
      - - 0
        - 2
      - - 2
        - 5
      - - 5
        - 10
      strength: 同 BKCLASS 网点数
      control: 同 MSABR 存活网点
    reason: 构造 exposure 结构（处理组强度 + 对照）
  - op: drop
    fields:
    - BRNUM
    reason: 跨年不稳定，弃用
operations:
- op: geocode
  reason: R8 平均边长 ≈ 0.46 km，匹配 0–1 km 细环
  detail: 新增列 h3 (res=8)；5483 行坐标缺失，h3 置空
- op: derive
  detail: 新增列 event_type
  reason: 区分并购关闭 / 仍存活（右删失）/ 数据缺失
- op: derive
  detail: 新增列 left_truncated
  reason: 设立年份早于观测起点 → 左截断标记
- op: derive
  detail: 长表新增列 dep_chg / dep_chg_rate
  reason: 存款年度变动额 / 变动率（结果变量）
- op: aggregate
  detail: 关闭事件 × 距离环 exposure（27,018 行）
  reason: 处理组强度 = 各环内同 BKCLASS 网点数；对照 = 同 MSABR 存活网点
