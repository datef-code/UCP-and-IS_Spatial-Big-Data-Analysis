[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datakit"
version = "0.1.0"
description = "通用数据处理 SDK：数据采集(discover)、描述性统计(profile)、清洗(clean)、校验(validate)、映射(map)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "data_use" }]
keywords = ["data", "etl", "profiling", "cleaning", "mapping"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "lxml>=4.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rdf = ["rdflib>=7.0"]
geo = ["h3>=4.0", "matplotlib>=3.7"]
# viz：交互展示扩展阶段（09_interactive / 08_interactive）用 plotly 出可 hover / 可播放的
#      单文件自包含 HTML（include_plotlyjs=True，离线可开）。教学类还用到 libpysal 的权重。
viz = ["plotly>=6.0", "imageio-ffmpeg>=0.5", "imageio>=2.30"]
modeling = [
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "shap>=0.44",
]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["datakit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
