stage: 05_map
mapped_at: '2026-09-06T19:59:13'
scheme:
  source: config/mapping.yaml
  ops:
  - op: derive
    name: birth_year
    expr: year(SIMS_ESTABLISHED_DATE)
    reason: 出生年；缺失 → 左截断候选
  - op: derive
    name: death_year
    expr: year(SIMS_ACQUIRED_DATE)
    reason: 死亡年；缺失 = 右删失
  - op: derive
    name: left_truncated
    expr: int(birth_year < 1994) —— 出生早于面板首期（出生年缺失按左截断）
    reason: 左截断标记
  - op: derive
    name: right_censored
    expr: int(death_year is null)
    reason: 右删失标记（仍存活）
  - op: derive
    name: event
    expr: closed if death_year notnull else alive
    reason: 事件类型（离散时间风险模型的因变量来源）
  - op: derive
    name: duration
    expr: obs_end - first_year + 1（obs_end = death_year 或 last_year）
    reason: 风险集内的存活年数
  - op: geocode
    name: spatial_key
    expr: h3.latlng_to_cell(lat, lng, 8)；h3 缺失时降级 0.01° 网格
    reason: 空间网格（竞争强度 / 残差空间自相关的聚合单元）
  - op: derive
    name: neighbor_count
    expr: 同网格内网点数（含自身）
    reason: 本地竞争强度代理
  - op: aggregate
    name: bank_fragility
    by: CERT
    params:
      n_branches: 网点数
      n_closed: 已关闭网点数
      geo_spread: sqrt(var(lat) + var(lng)) 的平方根，地理分散度
      levels:
        L0: 单网点
        L1: 多网点且地理集中（geo_spread < 中位数）
        L2: 多网点且地理分散（geo_spread >= 中位数）
    reason: 银行层共享脆弱性分层（离散时间风险模型的核心协变量）
  - op: drop
    fields:
    - BRNUM
    reason: 跨年重编号，弃用（见 04_validate brnum_not_tracking_key）
operations:
- op: geocode
  reason: H3 R7（平均边长 ≈ 0.46 km）作空间聚合单元
  detail: 新增列 h3 (res=7)；4399 行坐标缺失，h3 置空
- op: derive
  detail: 新增列 obs_end
  reason: 观察期终点：死亡年；仍存活则用最后一次出现年
- op: derive
  detail: 新增列 duration
  reason: 风险集内的存活年数（离散时间风险模型的 duration）
- op: derive
  detail: 新增列 right_censored
  reason: 右删失标记：无死亡年 = 仍存活
- op: derive
  detail: 新增列 event
  reason: 事件类型（closed / alive）
- op: derive
  detail: 新增列 left_truncated
  reason: 左截断：出生早于面板首期（出生年缺失按左截断处理）
- op: derive
  detail: 新增列 age
  reason: 网点年龄（末次观测年 − 出生年；出生年缺失用首次出现年代替）
- op: derive
  detail: 新增列 alive_years
  reason: 在面板中出现的年数
- op: derive
  reason: 本地竞争强度代理
  detail: 新增列 neighbor_count（同网格网点数，含自身）
- op: aggregate
  detail: 长表 → 网点维度表（按 UNINUMBR 聚合）
  reason: 离散时间生存模型的风险集骨架：每网点一行
- op: aggregate
  detail: 银行脆弱性分层（按 CERT，15,505 家）
  reason: 银行层共享脆弱性：L0/L1/L2
