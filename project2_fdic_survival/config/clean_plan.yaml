# config/clean_plan.yaml —— ③ 清洗计划（datakit.CleanPlan.from_spec 契约）
# 契约（datakit/clean.py）：
#   drop_na        : field: [..]                       reason
#   drop_duplicates: subset: [..]  keep: first         reason
#   clip           : field, lower/upper, on_violation: clip|to_null
#   fill           : field, method: constant|mean|median|mode|ffill|bfill, value
#   astype         : field, dtype
#   winsorize      : field, quantile
#   drop_columns   : field: [..]
# 禁止动作复核：forbidden 里的 op/field 若在决策日志中出现，④ 会报「违反禁止动作」。
version: 2

steps:
  - op: drop_na
    field: [UNINUMBR]
    reason: 寿命追踪主键缺失，无法跨年追踪，必须删除
    note: 上次实测剔除率 4.26%（2,822,977 → 2,702,716 行）

  - op: drop_duplicates
    subset: [UNINUMBR, YEAR]
    keep: first
    reason: 网点-年面板要求主键唯一

  - op: clip
    field: SIMS_LATITUDE
    lower: -90
    upper: 90
    on_violation: to_null
    reason: 越界坐标置空（不截断），避免伪造空间位置

  - op: clip
    field: SIMS_LONGITUDE
    lower: -180
    upper: 180
    on_violation: to_null
    reason: 同上

  - op: clip
    field: DEPSUMBR
    lower: 0
    on_violation: to_null
    reason: 存款不能为负，负值置为缺失而非截断

  - op: astype
    field: YEAR
    dtype: Int64
    reason: 年份用于面板对齐（可空整型，兼容缺失）

# 明令禁止的动作：③ 不得执行，④ 复核是否违反
forbidden:
  - op: fill
    field: [SIMS_ACQUIRED_DATE]
    reason: 缺失 = 右删失（仍存活），填充会摧毁生存 / 事件信息
  - op: fill
    field: [SIMS_ESTABLISHED_DATE]
    reason: 出生年缺失 → 按左截断处理，不填充
  - op: fill
    field: [SIMS_LATITUDE, SIMS_LONGITUDE]
    reason: 坐标填充会伪造空间位置，直接影响空间网格与竞争强度
