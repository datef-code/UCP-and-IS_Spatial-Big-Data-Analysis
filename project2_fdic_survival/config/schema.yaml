# config/schema.yaml —— 字段规格（role + level + 业务规则）
# role : key | event | time_varying | spatial | categorical | numeric | target | ignore
# level: required | important | optional | ignore
version: 1
dataset: fdic_sod
group_pattern: 'fdic_sod_#'

fields:
  - name: UNINUMBR
    role: key
    level: required
    dtype: integer
    description: 跨年唯一网点号；本项目唯一追踪主键
    rules:
      - kind: not_null
      - kind: unique
        fields: [UNINUMBR, YEAR]
        message: UNINUMBR × YEAR 必须唯一
    note: BRNUM 跨年重编号（全期 50.11% 的网点 BRNUM 发生变化），不可作跨年键

  - name: CERT
    role: key
    level: required
    dtype: integer
    description: 银行（机构）编号，用于银行层聚合；并购后网点会改挂新 CERT，本项目按首次观测归属
    rules:
      - kind: not_null

  - name: YEAR
    role: key
    level: required
    dtype: integer
    description: 数据年份
    rules:
      - kind: range
        min: 1994
        max: 2025

  - name: SIMS_ESTABLISHED_DATE
    role: event
    level: important
    dtype: datetime
    description: 网点设立（出生）日期
    rules:
      - kind: no_future_date

  - name: SIMS_ACQUIRED_DATE
    role: event
    level: important
    dtype: datetime
    description: 网点被并购 / 关闭（死亡）日期
    missing_semantics: 缺失 = 右删失（仍存活），是有意义信息，禁止填充
    rules:
      - kind: no_future_date

  - name: DEPSUMBR
    role: time_varying
    level: required
    dtype: numeric
    description: 网点存款余额（美元）；结果变量来源
    rules:
      - kind: non_negative
        message: 存款不能为负

  - name: SIMS_LATITUDE
    role: spatial
    level: important
    dtype: numeric
    description: 网点纬度
    rules:
      - kind: geo_lat          # 内置 [-90, 90]

  - name: SIMS_LONGITUDE
    role: spatial
    level: important
    dtype: numeric
    description: 网点经度
    rules:
      - kind: geo_lon          # 内置 [-180, 180]

  - name: BKCLASS
    role: categorical
    level: important
    dtype: string
    description: 银行类别；用于「同业」判定（处理组强度按同 BKCLASS 计数）

  # 注：MSABR / METROBR / SIMS_PROJECTION 是 project1（空间 DID）的口径，
  #     本项目（生存分析）不读取，已从 schema 移除，避免「声明但数据里没有」的假告警。

  - name: BRNUM
    role: ignore
    level: ignore
    dtype: string
    description: 银行内网点序号
    note: 跨年不稳定，已弃用为追踪主键
