# datakit.yaml —— 项目元信息（规范 datakit/PROJECT_STRUCTURE.md §1 / §8）
name: project2_fdic_survival
title: FDIC 网点寿命生存模型（离散时间 logit / cloglog + SHAP + 空间残差）
version: 1

# ---- 数据源（只读，任何脚本不得写入） ----
source_root: '../data_raw/fdic'
source_note: 'FDIC SOD 1994–2025，32 个年度文件 × 81 列，合计约 1.58 GB，只读；实际数据在仓库根 data_raw/（共享），本项目 data_raw/ 仅登记口径'
group: 'fdic_sod_#'
datasets: []

# ---- 内置五阶段 ----
stages: [01_discover, 02_profile, 03_clean, 04_validate, 05_map]

# ---- 扩展阶段（插件，NN >= 06；见规范 §8） ----
extensions:
  - stage: 06_train
    kind: modeling
    depends_on: [05_map]
    requires: [branch_panel.csv, bank_fragility.csv]
    extras: [modeling]
    blocking: false
    outputs: [metrics.json, logit_pipeline.pkl, shap_values.csv, moran_i.json]
  - stage: 07_visualize
    kind: visualization
    depends_on: [06_train]
    requires: [metrics.json, shap_importance.csv]
    extras: [modeling]
    blocking: false
    outputs: [manifest.json, figures/]
  - stage: 08_conclude
    kind: conclusion
    depends_on: [06_train, 07_visualize]
    requires: [metrics.json]
    extras: []
    blocking: false
    outputs: [conclusion.md, conclusion_report.json]
  - stage: 09_interactive
    kind: visualization
    depends_on: [05_map, 06_train]
    requires: [logit_coefficients.csv, test_predictions.csv, metrics.json, branch_panel.csv]
    extras: [viz]
    blocking: false
    outputs: [index.html, predict_demo.html, km_roc.html, model_report.html, manifest.json]

# ---- 全局口径 ----
options:
  with_md5: false        # 源数据量大，默认不做全量 MD5
  count_rows: false
  outlier_method: iqr
  outlier_threshold: 3.0      # IQR 倍数（重尾的 DEPSUMBR 用 3.0，避免异常值表爆炸）
  drop_row_warn_ratio: 0.05   # 删除行比例 > 5% → 阶段 4 给 P1 建议
  fill_warn_ratio: 0.50       # 某字段填充量 > 50% → 阶段 4 给 P1 建议
