# datakit.yaml —— 项目元信息（规范 datakit/PROJECT_STRUCTURE.md §1 / §8）
name: project6_spatial_teaching
title: 空间结构化教学管线 · L0→L3 四阶认知阶梯（多数据集）
version: 1

# ---- 数据源（只读，任何脚本不得写入） ----
source_root: '../data_raw'
source_note: '4 个数据集：fdic / sz_bike / snap_brightkite / snap_gowalla，只读；实际数据在仓库根 data_raw/（共享），本项目 data_raw/ 仅登记口径，暂不搬迁'
group: 'per_dataset'
datasets: [fdic, sz_bike, snap_brightkite, snap_gowalla]

# ---- 内置五阶段 ----
stages: [01_discover, 02_profile, 03_clean, 04_validate, 05_map]

# ---- 扩展阶段（插件，NN >= 06；见规范 §8） ----
extensions:
  - stage: 06_visualize
    kind: visualization
    depends_on: [05_map]
    requires: [ladder_report.json, L2_spatial_lag.csv]
    extras: [geo]
    blocking: false
    outputs: [visual_report.json, L2_moran_scatter.png, L3_ring_spillover.png]
  - stage: 07_conclude
    kind: conclusion
    depends_on: [06_visualize]
    requires: [global_visual_report.json]
    extras: []
    blocking: false
    outputs: [conclusion.md, conclusion_report.json]
  - stage: 08_interactive
    kind: teaching
    depends_on: [04_validate, 05_map]
    requires: [L2_spatial_lag.csv, ladder_report.json]
    extras: [geo]
    blocking: false
    outputs: [index.html, moran_explorer.html, ladder_compare.html, manifest.json]

# ---- 全局口径 ----
options:
  with_md5: false        # 源数据量大，默认不做全量 MD5
  count_rows: false
  outlier_method: iqr
  drop_row_warn_ratio: 0.05   # 删除行比例 > 5% → 阶段 4 给 P1 建议
  fill_warn_ratio: 0.50       # 某字段填充量 > 50% → 阶段 4 给 P1 建议
