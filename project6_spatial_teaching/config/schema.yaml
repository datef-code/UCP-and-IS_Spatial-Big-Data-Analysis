# config/schema.yaml —— 字段规格（多数据集项目：公共空间字段 + 各数据集差异）
# role : key | event | time_varying | spatial | categorical | numeric | target | ignore
# level: required | important | optional | ignore
# 规范 §3：机器起草事实层（类型/范围/枚举），人拍板判断层（等级/阈值）与意图层（说明/口径）
version: 2
datasets: [fdic, sz_bike, snap_brightkite, snap_gowalla]

# note = 「为什么是这个角色 / 等级」的判定依据（规范 §3.5），会被 ② 画像写进 fields.csv 的
#        level_reason 列，不要留空。
fields:
  - name: lon
    role: spatial
    level: required
    dtype: numeric
    description: 经度（清洗后统一命名，源字段 lng / SIMS_LONGITUDE / START_LNG）
    rules:
      - kind: geo_lon          # 内置 [-180, 180]
      - kind: not_null
        message: 无坐标点位无法进入 L0 网格化
    note: >-
      判为 spatial+required：本教程的全部内容（L0 网格化 → L1 权重 → L2 滞后 → L3 距离环）
      都以坐标为起点，缺它整条主线无法启动。故 not_null 是 P0，
      越界值 `to_null` 而非截断、且**明令禁止 fill**（填充会伪造位置）。

  - name: lat
    role: spatial
    level: required
    dtype: numeric
    description: 纬度（清洗后统一命名，源字段 lat / SIMS_LATITUDE / START_LAT）
    rules:
      - kind: geo_lat          # 内置 [-90, 90]
      - kind: not_null
        message: 无坐标点位无法进入 L0 网格化
    note: 同 lon：承担全部空间结构，required；禁止填充，越界置空。

  - name: value
    role: numeric
    level: required
    dtype: numeric
    description: 聚合到格的度量值（各数据集语义不同，见 per_dataset）
    note: >-
      判为 numeric+required：格值是 L0 聚合、L2 空间滞后、L3 溢出密度的唯一输入，
      缺它所有指标不可得。语义随数据集变化（0/1 关闭标记 vs 骑行/签到计数），
      因此统一命名但语义必须查 per_dataset——这是本项目「一套流程跑 N 个数据集」的关键约定。

per_dataset:
  fdic:
    role: 主示例
    value_semantics: 网点关闭 0/1 聚合
    source: project1_fdic_spatial/output/data/branch_dim.csv（UNINUMBR 口径）；缺失时从 data_raw/fdic/fdic_sod_*.csv 重建
    license: 公共领域（美国联邦政府数据），可商用
    note: 示例可自由分发
  sz_bike:
    role: 辅助示例
    value_semantics: 抽样日起点活跃度（抽样日 = 每月 15 日，共 20 天）
    sample_day: '15'           # 合成抽样参数：全量实测 31.49 GB / 24,939 个 CSV 不做全量载入
    license: 研究用途
    note: >-
      数据源已停更（实测最后日期 2021-08-31，覆盖 2020-01-01 ~ 2021-08-31 共 609 天）。
      文件命名 bike_<YYYYMMDD>_p<NNNNN>.csv；抽样按日期筛（每月 15 日），非按文件名。
      本地存档，无公开引用。
  snap_brightkite:
    role: 辅助示例
    value_semantics: 签到次数
    license: 仅限研究用途（SNAP），不允许商用
    note: >-
      数据年代 **2008-03 ~ 2010-10**（实测 2008-03-21 ~ 2010-10-18；官方 Apr 2008 – Oct 2010）
      ——旧版误写「2010–2013」，已更正。本地文件 4,747,287 行，比官方 4,491,143 check-ins
      多 256,144 行（无空行、5 字段完整，另有 6 行时间戳异常、109 行坐标越界）。
      引用：Cho, Myers & Leskovec, KDD 2011。
  snap_gowalla:
    role: 辅助示例
    value_semantics: 签到次数
    license: 仅限研究用途（SNAP），不允许商用
    note: >-
      数据年代 **2009-02 ~ 2010-10**（实测 2009-02-04 ~ 2010-10-23；官方 Feb 2009 – Oct 2010）
      ——旧版误写「2010–2013」，已更正。本地 6,442,892 行 vs 官方 6,442,890（+2，可忽略）。
      引用：Cho, Myers & Leskovec, KDD 2011。
