dataset: sz_bike
mapped_at: '2026-09-06T21:00:34'
mainline: H3 网格化 → 空间权重矩阵 → 空间滞后 → 距离环溢出
params:
  h3_res: 8
  hot_top_n: 100
  rings_km:
  - - 0
