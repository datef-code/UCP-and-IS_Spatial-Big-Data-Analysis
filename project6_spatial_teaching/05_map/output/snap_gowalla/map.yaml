operations:
- op: geocode
  object: lat,lon
  result: h3_cell（res=8）
  reason: L0 网格化
- op: aggregate
  object: value by h3_cell
  result: value（求和）
  reason: 点值聚合到格
- op: spatial_weights
  object: h3 邻接
  result: W（n=302580，行标准化）
  reason: L1 空间权重矩阵
- op: derive
  object: Wx
  result: spatial_lag
  reason: L2 空间滞后
- op: derive
  object: moran(value, W)
  result: moran_i=0.509016
  reason: L2 Moran's I
- op: aggregate
  object: top-100 热点 × 4 环
  result: L3_ring_spillover.csv
  reason: L3 距离环溢出
